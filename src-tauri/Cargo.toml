[package]
name = "pingpong-manager"
version = "0.1.2"
description = "PingPong Manager — table tennis club management sim"
authors = ["PingPong Manager"]
edition = "2021"

[lib]
name = "pingpong_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
